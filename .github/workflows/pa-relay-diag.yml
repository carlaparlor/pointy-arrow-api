name: pa-relay-diag
on:
  push:
    branches: [arena/01a0da09-pointy-arrow-api]
    paths:
      - ".pa-diag/**"
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Probe: can we elevate via yaml?
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0da09-pointy-arrow-api
          fetch-depth: 0
      - name: diag-github-token-is
        continue-on-error: true
        run: test -n "$GITHUB_TOKEN" && echo present
      - name: diag-push-samebranch
        continue-on-error: true
        run: |
          git config user.email "diag@bot"; git config user.name "diag"
          echo "diag $(date +%s)" > .pa-diag/push-probe.txt
          git add -A .pa-diag
          git commit -q -m "diag: push probe"
          git push origin HEAD:arena/01a0da09-pointy-arrow-api
      - name: diag-push-scratchbranch
        continue-on-error: true
        run: git push origin HEAD:refs/heads/diag-$RUN_ID-scratch
      - name: diag-status-write
        continue-on-error: true
        run: gh api -f state=success -f description=diag repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA
      - name: diag-issue-comment
        continue-on-error: true
        run: gh api -f body=diag repos/$GITHUB_REPOSITORY/issues/1/comments
      - name: diag-network-mailtm
        continue-on-error: true
        run: |
          python3 -m pip install --quiet requests
          python3 -c "import requests; r=requests.get('https://api.mail.tm/domains', timeout=30); print(r.status_code, len(r.text))"; test ${PIPESTATUS[0]} -eq 0
      - name: diag-network-gratisfy
        continue-on-error: true
        run: python3 -c "import requests; r=requests.get('https://gratisfy.xyz/health', timeout=30); print(r.status_code, len(r.text))"
