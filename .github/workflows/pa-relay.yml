name: pa-relay
on:
  push:
    branches: [arena/01a0da09-pointy-arrow-api]
    paths:
      - ".pa-relay/in/**"
  workflow_dispatch: {}

concurrency:
  group: pa-relay
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0da09-pointy-arrow-api
          fetch-depth: 0
      - name: Install deps
        run: python3 -m pip install --quiet requests
      - name: Run relay
        env:
          PA_RELAY_BRANCH: arena/01a0da09-pointy-arrow-api
        run: |
          rc=0
          python3 .pa-relay/runner.py 2> relay-stderr.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            MSG=$(tail -c 900 relay-stderr.log | tr '\n' ' ' | tail -c 110)
            gh api -f state=error -f description="runner rc=$rc: $MSG" \
               repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA || true
            echo "::error ::runner exited rc=$rc"
            exit "$rc"
          fi
